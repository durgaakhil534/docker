<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 CineFriend · Book your movie tickets</title>
    <!-- Google Font & Font Awesome for friendly icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(145deg, #f9f3e9 0%, #ffe9d6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        /* main card – soft, friendly, rounded */
        .booking-card {
            max-width: 1100px;
            width: 100%;
            background: #ffffffdd;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            box-shadow: 0 30px 50px -20px rgba(0, 0, 0, 0.2), 0 0 0 2px #ffffff80 inset;
            padding: 2rem 2rem 2.5rem;
            transition: all 0.2s ease;
            border: 1px solid #fff2e5;
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 700;
            color: #3b2b1f;
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 1.5rem;
            letter-spacing: -0.5px;
            flex-wrap: wrap;
        }

        h1 i {
            color: #e4a15b;
            background: #ffeedb;
            padding: 12px;
            border-radius: 30px;
            font-size: 2rem;
            box-shadow: 0 6px 12px #e4a15b33;
        }

        .subhead {
            font-size: 1.1rem;
            color: #7a5e4c;
            margin-top: -0.5rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            background: #fff9f3;
            padding: 12px 20px;
            border-radius: 60px;
            width: fit-content;
            border: 1px solid #ffdbbf;
        }

        .subhead i {
            color: #d18e4a;
        }

        /* movie grid */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 2.5rem;
        }

        .movie-option {
            background: #fffbf7;
            border-radius: 28px;
            padding: 18px 12px 16px;
            text-align: center;
            cursor: pointer;
            border: 3px solid #ffe1c6;
            transition: all 0.2s ease;
            box-shadow: 0 6px 0 #f3d9c2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: #4a3729;
        }

        .movie-option i {
            font-size: 2.8rem;
            color: #d18e4a;
            background: #ffefe1;
            padding: 12px;
            border-radius: 60px;
            transition: all 0.2s;
        }

        .movie-option span {
            font-size: 1.1rem;
            line-height: 1.3;
        }

        .movie-option small {
            font-size: 0.8rem;
            font-weight: 500;
            color: #a58368;
            background: #f7ece2;
            padding: 4px 10px;
            border-radius: 40px;
        }

        .movie-option.selected {
            border-color: #e4a15b;
            background: #fff5ea;
            box-shadow: 0 0 0 4px #ffdbb8, 0 8px 0 #cf9e6b;
            transform: translateY(-2px);
        }

        .movie-option.selected i {
            background: #e4a15b;
            color: white;
        }

        /* showtime & screen section */
        .show-details {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            margin-bottom: 2rem;
            align-items: center;
            background: #fef8f2;
            padding: 1.2rem 1.5rem;
            border-radius: 40px;
            border: 1px solid #ffddc4;
        }

        .showtime-picker {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }

        .showtime-picker label {
            font-weight: 600;
            color: #5e3f2c;
            display: flex;
            align-items: center;
            gap: 8px;
            background: #fff1e4;
            padding: 8px 18px;
            border-radius: 30px;
        }

        .time-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .time-btn {
            background: white;
            border: 2px solid #f3d9c2;
            color: #4a3729;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 40px;
            cursor: pointer;
            font-family: 'Quicksand', sans-serif;
            font-size: 0.95rem;
            transition: all 0.15s;
            box-shadow: 0 3px 0 #e7d5c4;
        }

        .time-btn.selected {
            background: #e4a15b;
            border-color: #e4a15b;
            color: white;
            box-shadow: 0 3px 0 #b87d41;
        }

        .time-btn:hover {
            background: #ffead8;
            border-color: #e4a15b;
        }

        .screen-badge {
            margin-left: auto;
            background: #32281f;
            color: #ffdbb8;
            padding: 8px 22px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 1px;
            border: 1px solid #624e3a;
        }

        .screen-badge i {
            color: #e4a15b;
        }

        /* seat map section */
        .seat-section {
            background: #fffdfb;
            border-radius: 36px;
            padding: 2rem 1.5rem 1.5rem;
            border: 2px dashed #ffdbb8;
            margin-bottom: 2rem;
            box-shadow: inset 0 2px 10px #ffefde;
        }

        .screen-label {
            text-align: center;
            font-weight: 700;
            color: #b87d41;
            letter-spacing: 6px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .screen-label i {
            font-size: 1.4rem;
        }

        .seat-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            margin-bottom: 24px;
        }

        .seat-row {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .seat {
            width: 40px;
            height: 40px;
            background: #f0e2d6;
            border-radius: 14px 14px 10px 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.8rem;
            color: #836b58;
            cursor: pointer;
            transition: all 0.1s ease;
            border: 2px solid #dabd9f;
            box-shadow: 0 3px 0 #b99b81;
            user-select: none;
        }

        .seat.selected {
            background: #e4a15b;
            border-color: #a56f37;
            color: white;
            box-shadow: 0 3px 0 #7e562b;
            transform: scale(1.02);
        }

        .seat.occupied {
            background: #cfb6a2;
            border-color: #ad8b72;
            color: #7f6753;
            cursor: not-allowed;
            box-shadow: 0 1px 0 #8f725a;
            opacity: 0.7;
        }

        .seat.occupied::after {
            content: "✕";
            font-size: 0.9rem;
            font-weight: 700;
            color: #654e3b;
        }

        .seat.occupied span {
            display: none;
        }

        .seat span {
            pointer-events: none;
        }

        /* legend */
        .legend {
            display: flex;
            justify-content: center;
            gap: 32px;
            flex-wrap: wrap;
            font-size: 0.9rem;
            font-weight: 500;
            color: #6a4f3a;
            margin-top: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-box {
            width: 26px;
            height: 26px;
            border-radius: 8px 8px 6px 6px;
            background: #f0e2d6;
            border: 2px solid #dabd9f;
        }

        .legend-box.selected {
            background: #e4a15b;
            border-color: #a56f37;
        }

        .legend-box.occupied {
            background: #cfb6a2;
            border-color: #ad8b72;
            position: relative;
        }

        .legend-box.occupied::after {
            content: "✕";
            font-size: 0.9rem;
            font-weight: 700;
            color: #654e3b;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        /* booking summary & action */
        .booking-footer {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-top: 1.5rem;
        }

        .summary {
            background: #fff5ea;
            padding: 16px 28px;
            border-radius: 60px;
            border: 1px solid #ffdbb8;
            display: flex;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
            font-weight: 600;
            color: #4f3625;
        }

        .summary i {
            color: #d18e4a;
            margin-right: 6px;
        }

        .total-price {
            font-size: 1.6rem;
            font-weight: 700;
            color: #9e6b38;
            letter-spacing: -0.5px;
        }

        .book-btn {
            background: #e4a15b;
            border: none;
            color: white;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 1.3rem;
            padding: 18px 42px;
            border-radius: 60px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 10px 0 #b87d41, 0 8px 18px #e4a15b66;
            border: 1px solid #ffdbb8;
            letter-spacing: 0.5px;
        }

        .book-btn:hover {
            background: #d8924a;
            transform: translateY(-2px);
            box-shadow: 0 12px 0 #b87d41, 0 12px 24px #e4a15b99;
        }

        .book-btn:active {
            transform: translateY(4px);
            box-shadow: 0 6px 0 #b87d41, 0 8px 18px #e4a15b66;
        }

        .book-btn:disabled {
            opacity: 0.5;
            transform: translateY(0);
            box-shadow: 0 6px 0 #b87d41;
            pointer-events: none;
        }

        .feedback {
            margin-top: 1.8rem;
            background: #cbe6d9;
            color: #1e5a3c;
            padding: 16px 24px;
            border-radius: 40px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 8px solid #5fa37c;
            animation: pop 0.3s ease;
        }

        .feedback i {
            font-size: 1.4rem;
        }

        @keyframes pop {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* small screens */
        @media (max-width: 700px) {
            .booking-card {
                padding: 1.5rem;
                border-radius: 32px;
            }

            h1 {
                font-size: 1.9rem;
            }

            .seat {
                width: 34px;
                height: 34px;
                font-size: 0.7rem;
            }

            .screen-badge {
                margin-left: 0;
                width: 100%;
                justify-content: center;
            }

            .book-btn {
                width: 100%;
                justify-content: center;
                padding: 16px 20px;
                font-size: 1.2rem;
            }

            .summary {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>
    <div class="booking-card">
        <!-- Header -->
        <h1>
            <i class="fas fa-film"></i> 
            CineFriend
        </h1>
        <div class="subhead">
            <i class="fas fa-smile-wink"></i> Pick a movie, time & seats — easy peasy!
        </div>

        <!-- Movie selection -->
        <div class="movie-grid" id="movieGrid">
            <div class="movie-option selected" data-movie="Dune: Part Two" data-price="12">
                <i class="fas fa-rocket"></i>
                <span>Dune: Part Two</span>
                <small>Sci-Fi · 12$</small>
            </div>
            <div class="movie-option" data-movie="Barbie" data-price="10">
                <i class="fas fa-dress"></i>
                <span>Barbie</span>
                <small>Comedy · 10$</small>
            </div>
            <div class="movie-option" data-movie="Oppenheimer" data-price="11">
                <i class="fas fa-atom"></i>
                <span>Oppenheimer</span>
                <small>Drama · 11$</small>
            </div>
            <div class="movie-option" data-movie="Inside Out 2" data-price="9">
                <i class="fas fa-face-smile"></i>
                <span>Inside Out 2</span>
                <small>Animation · 9$</small>
            </div>
        </div>

        <!-- Showtime + screen -->
        <div class="show-details">
            <div class="showtime-picker">
                <label><i class="fas fa-clock"></i> Showtime:</label>
                <div class="time-buttons" id="timeButtons">
                    <button class="time-btn selected" data-time="14:30">14:30</button>
                    <button class="time-btn" data-time="17:15">17:15</button>
                    <button class="time-btn" data-time="20:00">20:00</button>
                    <button class="time-btn" data-time="22:45">22:45</button>
                </div>
            </div>
            <div class="screen-badge">
                <i class="fas fa-tv"></i> SCREEN 3 · DOLBY
            </div>
        </div>

        <!-- Seat selection area -->
        <div class="seat-section">
            <div class="screen-label">
                <i class="fas fa-chevron-left"></i> 
                SCREEN 
                <i class="fas fa-chevron-right"></i>
            </div>
            <div class="seat-grid" id="seatGrid">
                <!-- rows will be generated by JS, but fallback static is okay -->
            </div>

            <!-- Legend -->
            <div class="legend">
                <div class="legend-item"><div class="legend-box"></div> Available</div>
                <div class="legend-item"><div class="legend-box selected"></div> Selected</div>
                <div class="legend-item"><div class="legend-box occupied"></div> Occupied</div>
            </div>
        </div>

        <!-- Booking summary and action -->
        <div class="booking-footer">
            <div class="summary" id="summary">
                <span><i class="fas fa-ticket-alt"></i> <span id="selectedCount">0</span> tickets</span>
                <span class="total-price" id="totalPrice">$0</span>
            </div>
            <button class="book-btn" id="bookBtn">
                <i class="fas fa-check-circle"></i> Book now
            </button>
        </div>

        <!-- Dynamic feedback message container -->
        <div id="feedbackContainer"></div>
    </div>

    <script>
        (function() {
            // ---------- STATE ----------
            // Movie data
            let selectedMovie = { name: 'Dune: Part Two', price: 12 };
            let selectedTime = '14:30';
            // Seats: we'll store selected seat IDs as Set
            let selectedSeats = new Set();
            // Occupied seats (fixed for demo) – you can customize
            const occupiedSeats = new Set([
                'A3','A4','B5','B6','C1','C2','C7','D4','D8','E2','E9','F5','F6','G3','G7','H1','H8'
            ]);
            
            // Seat rows config: rows A to H (8 rows), 10 seats per row
            const rows = ['A','B','C','D','E','F','G','H'];
            const seatsPerRow = 10;
            
            // DOM elements
            const movieGrid = document.getElementById('movieGrid');
            const timeButtons = document.getElementById('timeButtons');
            const seatGrid = document.getElementById('seatGrid');
            const summarySelectedCount = document.getElementById('selectedCount');
            const summaryTotalPrice = document.getElementById('totalPrice');
            const bookBtn = document.getElementById('bookBtn');
            const feedbackContainer = document.getElementById('feedbackContainer');

            // ---------- INITIAL RENDER SEATS ----------
            function renderSeatGrid() {
                seatGrid.innerHTML = '';
                rows.forEach(row => {
                    const rowDiv = document.createElement('div');
                    rowDiv.className = 'seat-row';
                    for (let i = 1; i <= seatsPerRow; i++) {
                        const seatId = row + i;
                        const seat = document.createElement('div');
                        seat.className = 'seat';
                        if (occupiedSeats.has(seatId)) {
                            seat.classList.add('occupied');
                        } else {
                            seat.classList.add('available');
                        }
                        seat.dataset.seatId = seatId;
                        seat.innerHTML = `<span>${i}</span>`;
                        
                        // if selected from state (after re-render, e.g. if we kept selection) 
                        if (selectedSeats.has(seatId) && !occupiedSeats.has(seatId)) {
                            seat.classList.add('selected');
                        }
                        
                        seat.addEventListener('click', onSeatClick);
                        rowDiv.appendChild(seat);
                    }
                    seatGrid.appendChild(rowDiv);
                });
            }

            // ---------- SEAT CLICK HANDLER ----------
            function onSeatClick(e) {
                const seat = e.currentTarget;
                const seatId = seat.dataset.seatId;
                
                // ignore if occupied
                if (seat.classList.contains('occupied')) return;

                if (selectedSeats.has(seatId)) {
                    selectedSeats.delete(seatId);
                    seat.classList.remove('selected');
                } else {
                    // optional: limit to 6 seats for friendliness (we'll allow up to 6)
                    if (selectedSeats.size >= 6) {
                        showFeedback('😊 You can select up to 6 seats for this booking.', 'info');
                        return;
                    }
                    selectedSeats.add(seatId);
                    seat.classList.add('selected');
                }
                updateSummary();
                clearFeedback(); // remove any previous feedback on new action
            }

            // ---------- UPDATE SUMMARY (count & total) ----------
            function updateSummary() {
                const count = selectedSeats.size;
                const total = count * selectedMovie.price;
                summarySelectedCount.textContent = count;
                summaryTotalPrice.textContent = `$${total}`;
                
                // Disable book button if no seats selected
                bookBtn.disabled = count === 0;
            }

            // ---------- SHOW FEEDBACK (friendly message) ----------
            function showFeedback(message, type = 'success') {
                feedbackContainer.innerHTML = ''; // clear
                const feedbackDiv = document.createElement('div');
                feedbackDiv.className = 'feedback';
                // icon based on type
                let icon = 'fa-circle-check';
                if (type === 'info') icon = 'fa-circle-info';
                if (type === 'error') icon = 'fa-circle-exclamation';
                feedbackDiv.innerHTML = `<i class="fas ${icon}"></i> ${message}`;
                feedbackContainer.appendChild(feedbackDiv);
                
                // auto remove after 4 seconds
                if (type !== 'error') {
                    setTimeout(() => {
                        if (feedbackContainer.contains(feedbackDiv)) {
                            feedbackDiv.style.opacity = '0';
                            feedbackDiv.style.transition = 'opacity 0.3s';
                            setTimeout(() => feedbackDiv.remove(), 300);
                        }
                    }, 4000);
                }
            }

            function clearFeedback() {
                feedbackContainer.innerHTML = '';
            }

            // ---------- RESET SEAT SELECTION (called on movie/time change) ----------
            function resetSeatSelection() {
                selectedSeats.clear();
                // update UI seats
                document.querySelectorAll('.seat.selected').forEach(seat => {
                    seat.classList.remove('selected');
                });
                updateSummary();
                clearFeedback();
            }

            // ---------- MOVIE SELECTION ----------
            movieGrid.addEventListener('click', (e) => {
                const movieOption = e.target.closest('.movie-option');
                if (!movieOption) return;

                // remove selected class from all
                document.querySelectorAll('.movie-option').forEach(opt => opt.classList.remove('selected'));
                movieOption.classList.add('selected');

                // update selected movie data
                const movieName = movieOption.dataset.movie;
                const price = parseFloat(movieOption.dataset.price);
                selectedMovie = { name: movieName, price: price };

                // Reset seat selection (different movie = fresh start)
                resetSeatSelection();

                // optional subtle feedback
                showFeedback(`🎬 Now booking for "${movieName}" — $${price} per ticket`, 'info');
            });

            // ---------- TIME SELECTION ----------
            timeButtons.addEventListener('click', (e) => {
                const timeBtn = e.target.closest('.time-btn');
                if (!timeBtn) return;

                document.querySelectorAll('.time-btn').forEach(btn => btn.classList.remove('selected'));
                timeBtn.classList.add('selected');
                selectedTime = timeBtn.dataset.time;

                // Reset seats because showtime changed (fresh availability)
                resetSeatSelection();
                showFeedback(`⏰ Showtime set to ${selectedTime}`, 'info');
            });

            // ---------- BOOK BUTTON ----------
            bookBtn.addEventListener('click', () => {
                if (selectedSeats.size === 0) {
                    showFeedback('Please pick at least one seat to book 🍿', 'error');
                    return;
                }

                // build friendly confirmation
                const seatsArray = Array.from(selectedSeats).sort();
                const seatsString = seatsArray.join(', ');
                const total = selectedSeats.size * selectedMovie.price;
                const count = selectedSeats.size;

                // show success feedback
                showFeedback(`✅ Booked ${count} ticket${count > 1 ? 's' : ''} for "${selectedMovie.name}" at ${selectedTime}. Seats: ${seatsString}. Total: $${total}. Enjoy! 🎉`, 'success');

                // clear selected seats (optional, like a real booking would reset)
                selectedSeats.clear();
                document.querySelectorAll('.seat.selected').forEach(seat => seat.classList.remove('selected'));
                updateSummary();

                // also clear feedback after a while (will auto remove, but we keep it for 6 sec)
                // additional clearing handled by timeout inside showFeedback
            });

            // ---------- INITIAL RENDER ----------
            function init() {
                renderSeatGrid();
                updateSummary();
                // ensure book button is disabled initially (0 seats)
                bookBtn.disabled = true;
            }

            init();

            // (optional) small UX: highlight default movie is already selected in html.
            // Set default movie price from active selection
            const defaultMovie = document.querySelector('.movie-option.selected');
            if (defaultMovie) {
                selectedMovie = {
                    name: defaultMovie.dataset.movie,
                    price: parseFloat(defaultMovie.dataset.price)
                };
            }
            // default time is already selected in html (14:30)
            // default seat selection is empty
        })();
    </script>
</body>
</html>
